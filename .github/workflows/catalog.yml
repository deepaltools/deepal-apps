name: Каталог

# Этот каталог читают все установленные магазины. Опечатка в нём видна не автору,
# а людям в машинах, поэтому он проверяется на каждое изменение.
#
# Схема 1 (catalog.json, catalog-test.json) — для магазинов 0.23 и старше: только
# релизы GitHub. Схема 2 (catalog-full*.json) — для 0.24 и новее: плюс приложения с
# сервера Deepal Tools.

on:
  push:
    paths: ['catalog*.json']
  pull_request:
    paths: ['catalog*.json']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Формат и обязательные поля
        run: |
          python3 - <<'PY'
          import json, re, os
          files = {'catalog.json': 1, 'catalog-test.json': 1, 'catalog-full.json': 2, 'catalog-full-test.json': 2}
          for name, schema in files.items():
              if not os.path.exists(name):
                  continue
              d = json.load(open(name))
              assert d.get('schema') == schema, f'{name}: не та версия схемы'
              assert d.get('apps'), f'{name}: нет ни одной записи'
              for a in d['apps']:
                  for field in ('id', 'package', 'name', 'source'):
                      assert a.get(field), f"{name}/{a.get('id', '?')}: нет поля {field}"
                  assert '.' in a['package'], f"{name}/{a['id']}: имя пакета без точки"
                  kind = a['source'].get('kind', 'github-releases')
                  if kind == 'deepaltools':
                      assert schema == 2, f"{name}/{a['id']}: источник deepaltools только во второй схеме"
                      assert a['source'].get('app'), f"{name}/{a['id']}: нет имени приложения на сервере"
                  else:
                      assert '/' in a['source']['repo'], f"{name}/{a['id']}: репозиторий без владельца"
                  sha = (a.get('signature', {}).get('sha256') or a.get('signatureSha256', '')).replace(':', '')
                  assert re.fullmatch(r'[0-9a-fA-F]{64}', sha), f"{name}/{a['id']}: отпечаток подписи не на месте"
              print(f"{name} в порядке, записей: {len(d['apps'])}")
          PY
